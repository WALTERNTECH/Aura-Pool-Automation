; Aura Pool table controller (ESP32). Build and flash with PlatformIO:
;   pio run -t upload && pio device monitor            (the 4G board, the default)
;   pio run -e esp32dev -t upload                      (a plain ESP32 on Wi-Fi)
; Both use Arduino-ESP32 3.3.12 (ESP-IDF 5.5) from the pioarduino platform; the 4G build needs
; its PPP library.

[platformio]
default_envs = t-a7670e

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  tzapu/WiFiManager @ 2.0.17
  bblanchon/ArduinoJson @ 7.2.1

; LilyGO T-A7670E: ESP32 with an A7670E 4G modem and SIM slot. Relay board on IO21, button on IO22.
[env:t-a7670e]
board = esp32dev
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAURA_FW_VERSION=\"1.1.0\"
  -DAURA_4G
  -DAURA_RELAY_PIN=21
  -DAURA_BUTTON_PIN=22

; Any ESP32 dev board on the venue's Wi-Fi. Relay board on IO26, button on IO27.
[env:esp32dev]
board = esp32dev
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAURA_FW_VERSION=\"1.1.0\"
