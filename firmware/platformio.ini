; Aura Pool table controller (ESP32). Build and flash with PlatformIO:
;   pio run -t upload && pio device monitor
; Arduino-ESP32 2.x (ESP-IDF 4.4) via espressif32 6.9.0; the code also builds on Arduino-ESP32 3.x.

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager @ 2.0.17
  bblanchon/ArduinoJson @ 7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DAURA_FW_VERSION=\"1.0.0\"
